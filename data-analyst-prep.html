<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Data Analyst Interview Prep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 260px; min-width: 260px; background: #1e293b; color: #fff;
    height: 100vh; position: sticky; top: 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  #sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid #334155; }
  #sidebar-header h2 { font-size: 14px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  #sidebar-header p { font-size: 12px; color: #64748b; margin-top: 4px; }
  .progress-bar-wrap { margin: 10px 16px 0; background: #334155; border-radius: 20px; height: 6px; }
  .progress-bar-fill { height: 6px; border-radius: 20px; background: linear-gradient(90deg,#6366f1,#06b6d4); transition: width .4s; }
  .progress-label { font-size: 11px; color: #64748b; padding: 4px 16px 10px; }

  .section-label {
    padding: 10px 16px 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  }
  .sql-label { color: #60a5fa; }
  .python-label { color: #4ade80; }
  .powerbi-label { color: #fb923c; }

  .day-btn {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer;
    border: none; background: transparent; color: #cbd5e1; width: 100%; text-align: left;
    font-size: 13px; transition: background .15s; border-radius: 0;
  }
  .day-btn:hover { background: #334155; }
  .day-btn.active { background: #334155; color: #fff; font-weight: 600; }
  .day-num {
    width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .sql-num { background: #1d4ed8; color: #fff; }
  .python-num { background: #166534; color: #fff; }
  .powerbi-num { background: #9a3412; color: #fff; }
  .day-btn.done .day-num { background: #15803d !important; }
  .day-btn.done .day-num::after { content: '✓'; }
  .day-btn.done .day-text { text-decoration: line-through; color: #64748b; }

  /* Main */
  #main { flex: 1; padding: 28px; max-width: 900px; }

  .card {
    background: #fff; border-radius: 16px; padding: 28px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }

  .day-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .day-badge {
    padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-sql { background: #dbeafe; color: #1d4ed8; }
  .badge-python { background: #dcfce7; color: #166534; }
  .badge-powerbi { background: #ffedd5; color: #9a3412; }
  .day-title { font-size: 22px; font-weight: 800; color: #0f172a; }
  .day-sub { font-size: 13px; color: #64748b; margin-top: 2px; }

  .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: #64748b; margin-bottom: 10px; display: flex; align-items: center; gap-6px;
  }
  .concept-text { font-size: 15px; color: #334155; line-height: 1.7; }
  .concept-text b { color: #0f172a; }

  .code-block {
    background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 18px;
    font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.7;
    overflow-x: auto; margin: 12px 0; white-space: pre;
  }
  .code-block .kw { color: #93c5fd; }
  .code-block .fn { color: #86efac; }
  .code-block .str { color: #fcd34d; }
  .code-block .cm { color: #64748b; }
  .code-block .num { color: #f9a8d4; }

  .output-block {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px;
    font-family: monospace; font-size: 13px; color: #334155; margin-top: -4px; white-space: pre;
  }

  .qs-list { list-style: none; counter-reset: q; }
  .qs-list li { counter-increment: q; padding: 10px 14px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px; font-size: 14px; color: #334155; display: flex; gap: 10px; }
  .qs-list li::before { content: "Q" counter(q); font-weight: 700; color: #6366f1; flex-shrink: 0; font-size: 12px; padding-top: 1px; }

  .mark-btn {
    margin-top: 16px; padding: 10px 24px; border-radius: 10px; border: none; cursor: pointer;
    font-weight: 700; font-size: 14px; transition: all .2s;
  }
  .mark-btn.pending { background: #6366f1; color: #fff; }
  .mark-btn.pending:hover { background: #4f46e5; }
  .mark-btn.done { background: #dcfce7; color: #166534; }

  .nav-btns { display: flex; gap: 10px; margin-top: 8px; }
  .nav-btn {
    padding: 9px 20px; border-radius: 10px; border: 1.5px solid #e2e8f0; background: #fff;
    cursor: pointer; font-size: 13px; font-weight: 600; color: #475569; transition: all .2s;
  }
  .nav-btn:hover { border-color: #6366f1; color: #6366f1; }

  .tip-box { background: #fefce8; border: 1px solid #fef08a; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #713f12; margin-top: 12px; }
  .tip-box b { color: #92400e; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: auto; position: relative; }
    #main { padding: 16px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>📊 Data Analyst Prep</h2>
    <p>30-Day Interview Kit</p>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="progress-label" id="prog-label">0 / 30 completed</div>
  <div id="day-list"></div>
</div>

<div id="main">
  <div id="content"></div>
</div>

<script>
const days = [
  // ── SQL ──────────────────────────────────────────────────────────────
  {
    topic: 'sql', title: 'SELECT, WHERE & ORDER BY',
    sub: 'The foundation of every SQL query',
    concept: `<b>SELECT</b> retrieves columns from a table. <b>WHERE</b> filters rows based on conditions. <b>ORDER BY</b> sorts the result set.<br><br>
These three clauses form the backbone of data retrieval. In interviews, you'll almost always start here — the key is writing clean, readable queries and knowing operator precedence (<b>AND</b> before <b>OR</b>).`,
    code: `<span class="cm">-- Find employees earning above 50000 in Sales dept, sorted by salary</span>
<span class="kw">SELECT</span> employee_id, name, salary, department
<span class="kw">FROM</span> employees
<span class="kw">WHERE</span> salary > <span class="num">50000</span>
  <span class="kw">AND</span> department = <span class="str">'Sales'</span>
<span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>;`,
    output: `employee_id | name       | salary  | department
-----------+------------+---------+-----------
       105 | Priya S    |  92000  | Sales
       102 | Rahul M    |  75000  | Sales
       108 | Anita K    |  55000  | Sales`,
    qs: [
      'What is the difference between WHERE and HAVING?',
      'How does ORDER BY handle NULL values by default?',
      'Can you use column aliases in a WHERE clause? Why or why not?'
    ],
    tip: 'WHERE filters BEFORE aggregation. HAVING filters AFTER. This is the most common interview trick question.'
  },
  {
    topic: 'sql', title: 'GROUP BY & Aggregate Functions',
    sub: 'Summarizing data across groups',
    concept: `<b>GROUP BY</b> collapses rows with the same value into a single row so aggregate functions like <b>COUNT</b>, <b>SUM</b>, <b>AVG</b>, <b>MAX</b>, <b>MIN</b> can be applied to each group.<br><br>
Every column in SELECT that is not inside an aggregate function must appear in GROUP BY. This is a strict rule that catches many beginners off guard.`,
    code: `<span class="cm">-- Total sales and average order value by region</span>
<span class="kw">SELECT</span>
  region,
  <span class="fn">COUNT</span>(*) <span class="kw">AS</span> total_orders,
  <span class="fn">SUM</span>(order_amount) <span class="kw">AS</span> total_revenue,
  <span class="fn">ROUND</span>(<span class="fn">AVG</span>(order_amount), <span class="num">2</span>) <span class="kw">AS</span> avg_order_value
<span class="kw">FROM</span> orders
<span class="kw">WHERE</span> status = <span class="str">'Completed'</span>
<span class="kw">GROUP BY</span> region
<span class="kw">HAVING</span> <span class="fn">SUM</span>(order_amount) > <span class="num">100000</span>
<span class="kw">ORDER BY</span> total_revenue <span class="kw">DESC</span>;`,
    output: `region  | total_orders | total_revenue | avg_order_value
--------+--------------+---------------+----------------
South   |          342 |      4,82,000 |         1409.36
North   |          289 |      3,91,500 |         1354.67
West    |          201 |      1,23,750 |          615.67`,
    qs: [
      'What is the difference between COUNT(*) and COUNT(column_name)?',
      'Can you GROUP BY a column that is not in the SELECT list?',
      'Write a query to find departments with more than 5 employees earning above ₹60,000.'
    ],
    tip: 'COUNT(*) counts all rows including NULLs. COUNT(col) counts only non-NULL values in that column.'
  },
  {
    topic: 'sql', title: 'JOINs — INNER, LEFT, RIGHT, FULL',
    sub: 'Combining data from multiple tables',
    concept: `<b>INNER JOIN</b> returns only matching rows from both tables. <b>LEFT JOIN</b> returns all rows from the left table plus matches from right (NULLs where no match). <b>RIGHT JOIN</b> is the reverse. <b>FULL OUTER JOIN</b> returns everything from both tables.<br><br>
In data analyst interviews, LEFT JOIN questions are extremely common — especially "find all customers who never placed an order."`,
    code: `<span class="cm">-- Customers who never placed an order (classic interview question)</span>
<span class="kw">SELECT</span> c.customer_id, c.name, c.email
<span class="kw">FROM</span> customers c
<span class="kw">LEFT JOIN</span> orders o <span class="kw">ON</span> c.customer_id = o.customer_id
<span class="kw">WHERE</span> o.customer_id <span class="kw">IS NULL</span>;

<span class="cm">-- Employees with their department names (INNER JOIN)</span>
<span class="kw">SELECT</span> e.name, e.salary, d.department_name
<span class="kw">FROM</span> employees e
<span class="kw">INNER JOIN</span> departments d <span class="kw">ON</span> e.dept_id = d.dept_id;`,
    output: `customer_id | name       | email
-----------+------------+------------------
       201 | Sneha R    | sneha@email.com
       305 | Mohan P    | mohan@email.com`,
    qs: [
      'What is the difference between INNER JOIN and LEFT JOIN?',
      'How would you find records in Table A that do NOT exist in Table B?',
      'What is a CROSS JOIN and when would you use it?'
    ],
    tip: 'To find non-matching rows: use LEFT JOIN and filter WHERE right_table.key IS NULL. This is faster than NOT IN with subquery.'
  },
  {
    topic: 'sql', title: 'Subqueries & CTEs',
    sub: 'Writing readable, modular SQL',
    concept: `A <b>subquery</b> is a query nested inside another query. A <b>CTE (Common Table Expression)</b> uses the WITH keyword to name a subquery so it can be reused. CTEs make complex queries readable and are preferred in interviews for clarity.<br><br>
Correlated subqueries reference the outer query — they run once per row and can be slow, but are sometimes unavoidable.`,
    code: `<span class="cm">-- CTE: Find employees earning above their department average</span>
<span class="kw">WITH</span> dept_avg <span class="kw">AS</span> (
  <span class="kw">SELECT</span> dept_id, <span class="fn">AVG</span>(salary) <span class="kw">AS</span> avg_salary
  <span class="kw">FROM</span> employees
  <span class="kw">GROUP BY</span> dept_id
)
<span class="kw">SELECT</span> e.name, e.salary, d.avg_salary, e.dept_id
<span class="kw">FROM</span> employees e
<span class="kw">JOIN</span> dept_avg d <span class="kw">ON</span> e.dept_id = d.dept_id
<span class="kw">WHERE</span> e.salary > d.avg_salary
<span class="kw">ORDER BY</span> e.dept_id, e.salary <span class="kw">DESC</span>;`,
    output: `name       | salary | avg_salary | dept_id
-----------+--------+------------+--------
Rajesh K   |  95000 |    71500.0 |       1
Priya S    |  82000 |    71500.0 |       1
Anil T     |  78000 |    62000.0 |       2`,
    qs: [
      'What is the difference between a subquery and a CTE?',
      'What is a correlated subquery? Give an example.',
      'Can you reference a CTE multiple times in the same query?'
    ],
    tip: 'Always prefer CTEs over nested subqueries in interviews — they show you write maintainable, readable code.'
  },
  {
    topic: 'sql', title: 'Window Functions — ROW_NUMBER, RANK, DENSE_RANK',
    sub: 'Ranking rows without collapsing groups',
    concept: `Window functions perform calculations across a set of rows related to the current row, <b>without collapsing them</b> like GROUP BY does. They use the OVER() clause with optional PARTITION BY and ORDER BY.<br><br>
<b>ROW_NUMBER</b>: unique sequential number even for ties. <b>RANK</b>: same rank for ties, skips next number. <b>DENSE_RANK</b>: same rank for ties, does NOT skip. These are extremely popular interview questions.`,
    code: `<span class="cm">-- Rank employees by salary within each department</span>
<span class="kw">SELECT</span>
  name, department, salary,
  <span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> department <span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>) <span class="kw">AS</span> row_num,
  <span class="fn">RANK</span>()       <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> department <span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>) <span class="kw">AS</span> rnk,
  <span class="fn">DENSE_RANK</span>() <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> department <span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>) <span class="kw">AS</span> dense_rnk
<span class="kw">FROM</span> employees;`,
    output: `name     | department | salary | row_num | rnk | dense_rnk
---------+------------+--------+---------+-----+-----------
Priya S  | Sales      |  92000 |       1 |   1 |         1
Rahul M  | Sales      |  75000 |       2 |   2 |         2
Anita K  | Sales      |  75000 |       3 |   2 |         2
Neha P   | Sales      |  55000 |       4 |   4 |         3`,
    qs: [
      'What is the difference between RANK and DENSE_RANK?',
      'How would you find the top 3 products by sales in each category?',
      'Can you use window functions in a WHERE clause?'
    ],
    tip: 'You CANNOT use window functions directly in WHERE. Wrap your query in a CTE or subquery, then filter on the rank.'
  },
  {
    topic: 'sql', title: 'Window Functions — LAG, LEAD, Running Totals',
    sub: 'Comparing rows and cumulative calculations',
    concept: `<b>LAG(col, n)</b> accesses the value from n rows before the current row. <b>LEAD(col, n)</b> accesses n rows ahead. These are perfect for month-over-month comparisons.<br><br>
<b>SUM() OVER(ORDER BY ...)</b> creates a running/cumulative total. <b>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</b> is the frame clause that controls which rows are included.`,
    code: `<span class="cm">-- Month-over-month revenue comparison</span>
<span class="kw">SELECT</span>
  month, revenue,
  <span class="fn">LAG</span>(revenue, <span class="num">1</span>) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> month) <span class="kw">AS</span> prev_month_revenue,
  revenue - <span class="fn">LAG</span>(revenue, <span class="num">1</span>) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> month) <span class="kw">AS</span> month_change,
  <span class="fn">SUM</span>(revenue) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> month
    <span class="kw">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span>) <span class="kw">AS</span> cumulative_revenue
<span class="kw">FROM</span> monthly_sales;`,
    output: `month   | revenue | prev_month | month_change | cumulative
--------+---------+------------+--------------+-----------
2024-01 |  120000 |       NULL |         NULL |    120000
2024-02 |  145000 |     120000 |        25000 |    265000
2024-03 |  132000 |     145000 |       -13000 |    397000
2024-04 |  168000 |     132000 |        36000 |    565000`,
    qs: [
      'What does LAG() return for the first row in a partition?',
      'How would you calculate a 3-month moving average using window functions?',
      'What is the difference between ROWS and RANGE in window frame clauses?'
    ],
    tip: 'LAG/LEAD return NULL by default for the first/last rows. Use the 3rd argument as a default: LAG(revenue, 1, 0).'
  },
  {
    topic: 'sql', title: 'String & Date Functions',
    sub: 'Manipulating text and working with dates',
    concept: `String functions transform text data — <b>UPPER/LOWER</b>, <b>TRIM</b>, <b>SUBSTRING</b>, <b>CONCAT</b>, <b>REPLACE</b>, <b>LENGTH</b>. Date functions are equally important — <b>DATEADD</b>, <b>DATEDIFF</b>, <b>FORMAT</b>, <b>YEAR/MONTH/DAY</b>, <b>NOW()/GETDATE()</b>.<br><br>
Syntax varies slightly between MySQL, PostgreSQL, and SQL Server but the concepts are the same.`,
    code: `<span class="cm">-- String operations</span>
<span class="kw">SELECT</span>
  <span class="fn">UPPER</span>(name) <span class="kw">AS</span> name_upper,
  <span class="fn">LENGTH</span>(email) <span class="kw">AS</span> email_len,
  <span class="fn">SUBSTRING</span>(phone, <span class="num">1</span>, <span class="num">3</span>) <span class="kw">AS</span> area_code,
  <span class="fn">CONCAT</span>(first_name, <span class="str">' '</span>, last_name) <span class="kw">AS</span> full_name
<span class="kw">FROM</span> customers;

<span class="cm">-- Date operations</span>
<span class="kw">SELECT</span>
  order_date,
  <span class="fn">YEAR</span>(order_date) <span class="kw">AS</span> order_year,
  <span class="fn">DATEDIFF</span>(<span class="fn">NOW</span>(), order_date) <span class="kw">AS</span> days_since_order,
  <span class="fn">DATE_FORMAT</span>(order_date, <span class="str">'%b %Y'</span>) <span class="kw">AS</span> month_year
<span class="kw">FROM</span> orders
<span class="kw">WHERE</span> order_date >= <span class="fn">DATE_SUB</span>(<span class="fn">NOW</span>(), <span class="kw">INTERVAL</span> <span class="num">30</span> <span class="kw">DAY</span>);`,
    output: `order_date  | order_year | days_since_order | month_year
-----------+------------+------------------+----------
2024-07-15  |       2024 |              373 | Jul 2024
2024-08-01  |       2024 |              356 | Aug 2024`,
    qs: [
      'How do you extract just the month from a date in SQL?',
      'How would you find all orders placed in the last 7 days?',
      'What is the difference between CHAR_LENGTH and LENGTH in MySQL?'
    ],
    tip: 'DATEDIFF syntax differs: MySQL DATEDIFF(end,start), SQL Server DATEDIFF(unit,start,end). Always clarify which DB you\'re using in interviews.'
  },
  {
    topic: 'sql', title: 'CASE WHEN, COALESCE & NULL Handling',
    sub: 'Conditional logic and handling missing data',
    concept: `<b>CASE WHEN</b> adds conditional logic (like IF-ELSE) inside SQL. <b>COALESCE(a, b, c)</b> returns the first non-NULL value — perfect for replacing NULLs with defaults. <b>NULLIF(a, b)</b> returns NULL if a equals b (useful for avoiding divide-by-zero).<br><br>
NULL handling is a common trap — NULL is not equal to anything, not even NULL. Use IS NULL / IS NOT NULL.`,
    code: `<span class="cm">-- Categorize employees by salary band + handle NULL bonus</span>
<span class="kw">SELECT</span>
  name, salary,
  <span class="kw">CASE</span>
    <span class="kw">WHEN</span> salary >= <span class="num">90000</span> <span class="kw">THEN</span> <span class="str">'Senior'</span>
    <span class="kw">WHEN</span> salary >= <span class="num">60000</span> <span class="kw">THEN</span> <span class="str">'Mid-Level'</span>
    <span class="kw">ELSE</span>                       <span class="str">'Junior'</span>
  <span class="kw">END</span> <span class="kw">AS</span> salary_band,
  <span class="fn">COALESCE</span>(bonus, <span class="num">0</span>) <span class="kw">AS</span> bonus_safe,
  salary / <span class="fn">NULLIF</span>(years_exp, <span class="num">0</span>) <span class="kw">AS</span> salary_per_year
<span class="kw">FROM</span> employees;`,
    output: `name     | salary | salary_band | bonus_safe | salary_per_year
---------+--------+-------------+------------+----------------
Priya S  |  92000 | Senior      |       5000 |           9200
Rahul M  |  75000 | Mid-Level   |          0 |           6818
Anil T   |  42000 | Junior      |       1000 |           NULL`,
    qs: [
      'What does NULL = NULL evaluate to in SQL?',
      'What is the difference between COALESCE and ISNULL/NVL?',
      'How would you replace NULL values with the average of the column?'
    ],
    tip: 'NULL = NULL is UNKNOWN (not TRUE). Always use IS NULL. COALESCE is ANSI standard and works across all databases; ISNULL is SQL Server-specific.'
  },
  {
    topic: 'sql', title: 'Indexes & Query Optimization',
    sub: 'Writing fast SQL that scales',
    concept: `<b>Indexes</b> are data structures that speed up data retrieval. A <b>clustered index</b> determines the physical sort order of table data (one per table). A <b>non-clustered index</b> is a separate structure pointing back to the data (multiple allowed).<br><br>
Common optimization tips: avoid SELECT *, use indexes on JOIN/WHERE/ORDER BY columns, avoid functions on indexed columns in WHERE clause, use EXPLAIN/EXPLAIN PLAN to analyze queries.`,
    code: `<span class="cm">-- BAD: Function on indexed column kills the index</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> orders <span class="kw">WHERE</span> <span class="fn">YEAR</span>(order_date) = <span class="num">2024</span>;

<span class="cm">-- GOOD: Range comparison uses the index</span>
<span class="kw">SELECT</span> order_id, customer_id, amount
<span class="kw">FROM</span> orders
<span class="kw">WHERE</span> order_date >= <span class="str">'2024-01-01'</span>
  <span class="kw">AND</span> order_date <  <span class="str">'2025-01-01'</span>;

<span class="cm">-- Create an index</span>
<span class="kw">CREATE INDEX</span> idx_orders_date <span class="kw">ON</span> orders(order_date);
<span class="kw">CREATE INDEX</span> idx_emp_dept    <span class="kw">ON</span> employees(dept_id, salary);

<span class="cm">-- Check query plan</span>
<span class="kw">EXPLAIN</span> <span class="kw">SELECT</span> * <span class="kw">FROM</span> orders <span class="kw">WHERE</span> customer_id = <span class="num">101</span>;`,
    output: `id | select_type | table  | type | key              | rows  | Extra
---+-------------+--------+------+------------------+-------+-------
 1 | SIMPLE      | orders | ref  | idx_customer_id  |    12 | NULL`,
    qs: [
      'What is the difference between a clustered and non-clustered index?',
      'Why does putting a function on a WHERE column hurt performance?',
      'What does the EXPLAIN output tell you about a query?'
    ],
    tip: 'Composite index column ORDER matters: an index on (dept_id, salary) helps queries filtering by dept_id, but NOT queries filtering only by salary.'
  },
  {
    topic: 'sql', title: 'Real Interview Problems',
    sub: 'Top SQL problems asked in data analyst interviews',

function getCompleted() {
  try { return JSON.parse(localStorage.getItem('da_prep_done') || '[]'); } catch { return []; }
}
function setCompleted(arr) {
  localStorage.setItem('da_prep_done', JSON.stringify(arr));
}

function updateProgress() {
  const done = getCompleted();
  const pct = Math.round((done.length / days.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done.length + ' / ' + days.length + ' completed';
}

function buildSidebar() {
  const list = document.getElementById('day-list');
  let curTopic = '';
  days.forEach((d, i) => {
    if (d.topic !== curTopic) {
      curTopic = d.topic;
      const lbl = document.createElement('div');
      lbl.className = 'section-label ' + curTopic + '-label';
      lbl.textContent = TOPIC_LABELS[curTopic];
      list.appendChild(lbl);
    }
    const done = getCompleted().includes(i);
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (done ? ' done' : '') + (i === 0 ? ' active' : '');
    btn.id = 'day-btn-' + i;
    btn.innerHTML = `<span class="day-num ${curTopic}-num">${done ? '' : i+1}</span>
                     <span class="day-text">Day ${i+1}: ${d.title}</span>`;
    btn.onclick = () => showDay(i);
    list.appendChild(btn);
  });
}

function showDay(idx) {
  const d = days[idx];
  const done = getCompleted().includes(idx);
  const topicClass = TOPIC_CLASS[d.topic];

  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('day-btn-' + idx).classList.add('active');

  const qs = d.qs.map(q => `<li>${q}</li>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="day-header">
        <span class="day-badge badge-${topicClass}">${TOPIC_LABELS[d.topic]}</span>
        <div>
          <div class="day-title">Day ${idx+1}: ${d.title}</div>
          <div class="day-sub">${d.sub}</div>
        </div>
      </div>

      <div class="section-title">📖 Concept</div>
      <div class="concept-text">${d.concept}</div>

      ${d.tip ? `<div class="tip-box">💡 <b>Interview Tip:</b> ${d.tip}</div>` : ''}
    </div>

    <div class="card">
      <div class="section-title">💻 Code Example</div>
      <div class="code-block">${d.code}</div>
      <div class="section-title" style="margin-top:14px">📤 Output</div>
      <div class="output-block">${d.output}</div>
    </div>

    <div class="card">
      <div class="section-title">🎯 Interview Questions</div>
      <ul class="qs-list">${qs}</ul>
      <button class="mark-btn ${done ? 'done' : 'pending'}" id="mark-btn" onclick="toggleDone(${idx})">
        ${done ? '✓ Completed — Mark Incomplete' : 'Mark as Complete'}
      </button>
    </div>

    <div class="nav-btns">
      ${idx > 0 ? `<button class="nav-btn" onclick="showDay(${idx-1})">← Day ${idx}</button>` : ''}
      ${idx < days.length-1 ? `<button class="nav-btn" onclick="showDay(${idx+1})">Day ${idx+2} →</button>` : ''}
    </div>
  `;
  window.scrollTo(0, 0);
}

function toggleDone(idx) {
  let done = getCompleted();
  const pos = done.indexOf(idx);
  if (pos === -1) done.push(idx); else done.splice(pos, 1);
  setCompleted(done);
  updateProgress();
  const btn = document.getElementById('day-btn-' + idx);
  const isDone = done.includes(idx);
  btn.className = 'day-btn active' + (isDone ? ' done' : '');
  btn.innerHTML = `<span class="day-num ${days[idx].topic}-num">${isDone ? '' : idx+1}</span>
                   <span class="day-text">Day ${idx+1}: ${days[idx].title}</span>`;
  document.getElementById('mark-btn').className = 'mark-btn ' + (isDone ? 'done' : 'pending');
  document.getElementById('mark-btn').textContent = isDone ? '✓ Completed — Mark Incomplete' : 'Mark as Complete';
}

buildSidebar();
updateProgress();
showDay(0);
</script>
</body>
</html>
