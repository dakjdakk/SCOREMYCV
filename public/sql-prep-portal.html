<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day SQL Interview Prep</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }

/* TOP NAV */
.topnav {
  background: #1e293b; color: #fff; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.topnav h1 { font-size: 16px; font-weight: 800; color: #60a5fa; letter-spacing: .3px; }
.topnav span { font-size: 12px; color: #64748b; }
.prog-wrap { display: flex; align-items: center; gap: 10px; }
.prog-bar { width: 140px; height: 6px; background: #334155; border-radius: 10px; }
.prog-fill { height: 6px; border-radius: 10px; background: linear-gradient(90deg,#3b82f6,#06b6d4); transition: width .4s; }
.prog-text { font-size: 12px; color: #94a3b8; }

/* LAYOUT */
.layout { display: flex; height: calc(100vh - 56px); }

/* SIDEBAR */
#sidebar {
  width: 240px; min-width: 240px; background: #1e293b;
  overflow-y: auto; border-right: 1px solid #334155;
}
.sidebar-section { padding: 10px 12px 4px; font-size: 10px; font-weight: 800;
  letter-spacing: 1.2px; text-transform: uppercase; color: #475569; }
.day-btn {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  cursor: pointer; background: transparent; border: none; color: #94a3b8;
  width: 100%; text-align: left; font-size: 12.5px; transition: background .15s;
}
.day-btn:hover { background: #273549; color: #e2e8f0; }
.day-btn.active { background: #1d4ed8; color: #fff; font-weight: 600; }
.day-btn.done { color: #64748b; }
.day-num {
  width: 22px; height: 22px; border-radius: 50%; background: #334155;
  color: #94a3b8; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.day-btn.active .day-num { background: #fff; color: #1d4ed8; }
.day-btn.done .day-num { background: #166534; color: #fff; }
.locked { opacity: .4; cursor: not-allowed; }

/* MAIN */
#main { flex: 1; overflow-y: auto; padding: 0; }
.day-content { max-width: 860px; margin: 0 auto; padding: 28px 24px 60px; }

/* DAY HEADER */
.day-header {
  background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
  border-radius: 14px; padding: 24px 28px; margin-bottom: 24px; color: #fff;
}
.day-tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; opacity: .8; margin-bottom: 6px; }
.day-title { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
.day-meta { font-size: 13px; opacity: .75; display: flex; gap: 16px; margin-top: 8px; }
.day-meta span { background: rgba(255,255,255,.15); border-radius: 20px; padding: 3px 12px; }

/* SECTION CARD */
.section-card { background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.section-label {
  font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  color: #3b82f6; margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

/* THEORY */
.theory-text { font-size: 15px; color: #334155; line-height: 1.8; }
.theory-text b { color: #1e293b; }
.theory-text .highlight { background: #eff6ff; border-left: 3px solid #3b82f6; padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; }
.theory-text ul { margin: 10px 0 10px 20px; }
.theory-text ul li { margin-bottom: 6px; }

/* SYNTAX BOX */
.syntax-box {
  background: #0f172a; border-radius: 10px; padding: 18px 20px;
  font-family: 'Courier New', monospace; font-size: 13.5px;
  line-height: 1.8; overflow-x: auto; margin: 14px 0; white-space: pre;
}
.kw { color: #93c5fd; font-weight: 700; }
.dt { color: #86efac; }
.str { color: #fcd34d; }
.cm { color: #475569; font-style: italic; }
.num { color: #f9a8d4; }
.tbl { color: #fb923c; }
.fn { color: #c084fc; }

/* OUTPUT */
.output-label { font-size: 11px; color: #64748b; font-weight: 600; margin-bottom: 6px; margin-top: -6px; }
.output-box {
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
  padding: 14px 16px; font-family: 'Courier New', monospace; font-size: 13px;
  color: #1e293b; white-space: pre; overflow-x: auto; margin-bottom: 14px;
}

/* TIP */
.tip-box {
  background: #fefce8; border: 1px solid #fef08a; border-radius: 10px;
  padding: 12px 16px; font-size: 13.5px; color: #78350f; margin-top: 12px;
}
.warn-box {
  background: #fff1f2; border: 1px solid #fecdd3; border-radius: 10px;
  padding: 12px 16px; font-size: 13.5px; color: #9f1239; margin-top: 8px;
}

/* SQL EDITOR */
.editor-wrap { border: 1.5px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
.editor-toolbar {
  background: #1e293b; padding: 8px 14px; display: flex; align-items: center;
  justify-content: space-between;
}
.editor-toolbar span { color: #60a5fa; font-size: 12px; font-weight: 600; }
.run-btn {
  background: #3b82f6; color: #fff; border: none; border-radius: 6px;
  padding: 6px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: background .2s;
}
.run-btn:hover { background: #2563eb; }
.run-btn:disabled { background: #475569; cursor: wait; }
textarea.sql-input {
  width: 100%; font-family: 'Courier New', monospace; font-size: 13px;
  background: #0f172a; color: #e2e8f0; border: none; outline: none;
  padding: 16px; resize: vertical; min-height: 130px; line-height: 1.7;
  tab-size: 2;
}
.result-area {
  background: #f8fafc; border-top: 1px solid #e2e8f0;
  font-family: 'Courier New', monospace; font-size: 12.5px;
  color: #1e293b; padding: 14px 16px; min-height: 48px; max-height: 260px; overflow: auto;
  white-space: pre;
}
.result-area.error { color: #dc2626; }
.result-area.success { color: #166534; }
table.result-table { border-collapse: collapse; font-size: 13px; width: 100%; }
table.result-table th { background: #1e293b; color: #fff; padding: 6px 12px; text-align: left; font-size: 12px; }
table.result-table td { padding: 6px 12px; border-bottom: 1px solid #e2e8f0; color: #334155; }
table.result-table tr:hover td { background: #f0f9ff; }

/* INTERVIEW QUESTIONS */
.q-item { border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
.q-header { padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; cursor: pointer; }
.q-header:hover { background: #f8fafc; }
.q-num { background: #dbeafe; color: #1d4ed8; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }
.q-text { font-size: 14.5px; color: #1e293b; font-weight: 500; flex: 1; line-height: 1.5; }
.q-company { font-size: 11px; color: #64748b; background: #f1f5f9; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
.toggle-btn { background: #f1f5f9; border: none; border-radius: 8px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; color: #475569; flex-shrink: 0; }
.q-answer { display: none; padding: 0 16px 16px; border-top: 1px solid #e2e8f0; }
.q-answer.open { display: block; }
.answer-text { font-size: 14px; color: #334155; line-height: 1.75; margin-top: 12px; }
.answer-text b { color: #1e293b; }
.answer-code { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 14px 16px; font-family: monospace; font-size: 12.5px; margin-top: 10px; white-space: pre; overflow-x: auto; line-height: 1.7; }

/* MARK COMPLETE */
.complete-bar { display: flex; align-items: center; justify-content: space-between; background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 12px; padding: 14px 20px; margin-top: 8px; }
.complete-bar p { font-size: 14px; color: #166534; font-weight: 600; }
.mark-btn { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 9px 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .2s; }
.mark-btn:hover { background: #15803d; }
.mark-btn.done-btn { background: #e2e8f0; color: #64748b; }

/* NAV BTNS */
.day-nav { display: flex; gap: 12px; margin-top: 20px; }
.nav-btn { padding: 10px 22px; border-radius: 10px; border: 1.5px solid #e2e8f0; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; color: #475569; transition: all .2s; }
.nav-btn:hover { border-color: #3b82f6; color: #3b82f6; }
.nav-btn.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.nav-btn.primary:hover { background: #2563eb; }

@media(max-width:700px){
  .layout { flex-direction: column; }
  #sidebar { width: 100%; height: auto; max-height: 200px; }
}

/* CERTIFICATE MODAL */
.cert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 9999; }
.cert-overlay.show { display: flex; }
.cert-modal { background: #fff; border-radius: 20px; padding: 0; width: 100%; max-width: 680px; overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
.cert-actions { background: #1e293b; padding: 14px 24px; display: flex; gap: 10px; justify-content: flex-end; }
.cert-action-btn { border: none; border-radius: 8px; padding: 9px 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.cert-print-btn { background: #3b82f6; color: #fff; }
.cert-print-btn:hover { background: #2563eb; }
.cert-close-btn { background: #334155; color: #e2e8f0; }
.cert-close-btn:hover { background: #475569; }

/* NAV user info */
.nav-user-area { display: flex; align-items: center; gap: 8px; }
.nav-forum-btn { background: #6366f1; color: #fff; border: none; border-radius: 7px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
.nav-forum-btn:hover { background: #4f46e5; }
.nav-username { font-size: 12px; color: #94a3b8; }
.nav-logout-btn { background: #334155; color: #94a3b8; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
.nav-logout-btn:hover { background: #475569; color: #e2e8f0; }
</style>
</head>

<script>
// ─── CURRICULUM ────────────────────────────────────────────────────────────
const curriculum = [
  { section: 'Week 1 — DDL Foundations' },
  {
    day: 1, title: 'CREATE DATABASE & CREATE TABLE',
    subtitle: 'Starting from scratch — building your first database',
    duration: '~60 min', questions: 6,
    content: `
<div class="section-label">📖 What is SQL?</div>
<div class="theory-text">
  <b>SQL (Structured Query Language)</b> is the standard language used to communicate with relational databases. Every major company — Amazon, Google, Infosys, TCS — stores its business data in a relational database, and SQL is the tool to interact with it.<br><br>
  SQL commands are grouped into categories:
  <ul>
    <li><b>DDL (Data Definition Language)</b> — CREATE, ALTER, DROP (defines structure)</li>
    <li><b>DML (Data Manipulation Language)</b> — INSERT, UPDATE, DELETE (manages data)</li>
    <li><b>DQL (Data Query Language)</b> — SELECT (retrieves data)</li>
    <li><b>DCL (Data Control Language)</b> — GRANT, REVOKE (permissions)</li>
    <li><b>TCL (Transaction Control Language)</b> — COMMIT, ROLLBACK (transactions)</li>
  </ul>
  <div class="highlight">Today focuses on <b>DDL</b> — specifically creating the structure where data will live.</div>
</div>

<div class="section-label" style="margin-top:22px">🏗️ CREATE DATABASE</div>
<div class="theory-text">Before creating tables, you need a <b>database</b> — a container that holds all related tables. Think of it as a folder on your computer.</div>`,
    syntax: `<span class="cm">-- Create a new database</span>
<span class="kw">CREATE DATABASE</span> company_db;

<span class="cm">-- Use (switch to) the database</span>
<span class="kw">USE</span> company_db;

<span class="cm">-- See all databases on the server</span>
<span class="kw">SHOW DATABASES</span>;`,
    syntax2: `<span class="cm">-- CREATE TABLE syntax</span>
<span class="kw">CREATE TABLE</span> <span class="tbl">table_name</span> (
  column1 <span class="dt">datatype</span> [constraints],
  column2 <span class="dt">datatype</span> [constraints],
  ...
);

<span class="cm">-- Real example: Employee table</span>
<span class="kw">CREATE TABLE</span> <span class="tbl">employees</span> (
  employee_id  <span class="dt">INT</span>           <span class="kw">PRIMARY KEY AUTO_INCREMENT</span>,
  first_name   <span class="dt">VARCHAR(50)</span>   <span class="kw">NOT NULL</span>,
  last_name    <span class="dt">VARCHAR(50)</span>   <span class="kw">NOT NULL</span>,
  email        <span class="dt">VARCHAR(100)</span>  <span class="kw">UNIQUE NOT NULL</span>,
  salary       <span class="dt">DECIMAL(10,2)</span> <span class="kw">DEFAULT</span> <span class="num">0.00</span>,
  hire_date    <span class="dt">DATE</span>          <span class="kw">NOT NULL</span>,
  department   <span class="dt">VARCHAR(50)</span>,
  is_active    <span class="dt">BOOLEAN</span>       <span class="kw">DEFAULT</span> <span class="kw">TRUE</span>
);`,
    theory2: `<div class="section-label" style="margin-top:22px">📦 SQL Data Types — Know These Cold</div>
<div class="theory-text">
  Choosing the right data type is critical — it affects storage, performance, and data integrity.
  <ul>
    <li><b>INT</b> — whole numbers (-2 billion to +2 billion)</li>
    <li><b>BIGINT</b> — very large whole numbers (for IDs, phone numbers)</li>
    <li><b>VARCHAR(n)</b> — variable-length text, up to n characters. <b>Most common for names, emails</b></li>
    <li><b>CHAR(n)</b> — fixed-length text, always uses n characters (good for codes like 'IN', 'US')</li>
    <li><b>DECIMAL(p,s)</b> — exact decimal: p=total digits, s=decimal places. <b>Use for money</b></li>
    <li><b>FLOAT / DOUBLE</b> — approximate decimals. <b>Never use for money</b> (rounding errors)</li>
    <li><b>DATE</b> — date only: YYYY-MM-DD</li>
    <li><b>DATETIME / TIMESTAMP</b> — date + time</li>
    <li><b>BOOLEAN</b> — TRUE or FALSE (stored as 1/0)</li>
    <li><b>TEXT</b> — unlimited text (descriptions, notes)</li>
  </ul>
  <div class="warn-box">⚠️ <b>Common mistake:</b> Using FLOAT for salary/price. Always use DECIMAL for financial data — FLOAT has rounding errors that can cause ₹0.01 discrepancies in billing.</div>
  <div class="tip-box">💡 <b>Interview tip:</b> The difference between CHAR and VARCHAR is a very common interview question. CHAR always uses fixed space; VARCHAR only uses what's needed plus 1-2 bytes overhead.</div>
</div>`,
    practiceSQL: `-- Practice: Create these tables in the editor below
-- The database already has sample tables loaded

-- Try creating an orders table:
CREATE TABLE orders (
  order_id    INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL,
  order_date  TEXT NOT NULL,
  amount      REAL DEFAULT 0,
  status      TEXT DEFAULT 'Pending'
);

-- Check the table was created:
SELECT name FROM sqlite_master WHERE type='table';`,
    practiceNote: 'The editor uses SQLite syntax (similar to MySQL). Try modifying the table structure and see what happens!',
    interview: [
      {
        q: 'What is the difference between CHAR and VARCHAR?',
        company: 'TCS / Infosys',
        a: `<b>CHAR(n)</b> is a <b>fixed-length</b> data type. It always stores exactly n characters, padding with spaces if the value is shorter. Example: CHAR(10) storing 'Hi' stores 'Hi        ' (8 trailing spaces).<br><br>
<b>VARCHAR(n)</b> is a <b>variable-length</b> data type. It stores only the actual characters plus 1-2 bytes of overhead to record the length. Example: VARCHAR(100) storing 'Hi' stores just 'Hi' (3 bytes total).<br><br>
<b>When to use which:</b><ul>
<li>Use CHAR for fixed-length codes: country codes ('IN', 'US'), gender ('M','F'), fixed codes</li>
<li>Use VARCHAR for everything else: names, emails, descriptions</li></ul>
<b>Performance note:</b> CHAR can be slightly faster for fixed-length lookups, but VARCHAR saves storage for variable data.`,
        code: `CHAR(10):   'Mumbai    '   -- always 10 chars (padded with spaces)
VARCHAR(10): 'Mumbai'      -- only 6 chars + length overhead`
      },
      {
        q: 'What is the difference between DECIMAL and FLOAT? Which one should you use for storing salary or price?',
        company: 'Wipro / Accenture',
        a: `<b>DECIMAL(p,s)</b> stores <b>exact</b> decimal numbers. p = total digits, s = digits after decimal. Example: DECIMAL(10,2) can store up to 99999999.99 with exact precision.<br><br>
<b>FLOAT/DOUBLE</b> stores <b>approximate</b> decimal numbers using binary floating-point representation. They're fast but can have tiny rounding errors.<br><br>
<b>Always use DECIMAL for money/salary/price.</b> Float can produce results like 10.00 + 10.00 = 19.999999998 — which is a disaster for financial calculations.<br><br>
<b>Use FLOAT</b> for scientific/engineering values where small rounding errors don't matter (weight, temperature, coordinates).`,
        code: `-- WRONG: Float for money
salary FLOAT   -- might store 50000.0 as 49999.999998

-- RIGHT: Decimal for money
salary DECIMAL(10,2)  -- stores exactly 50000.00`
      },
      {
        q: 'What does AUTO_INCREMENT do? Is it available in all databases?',
        company: 'Mu Sigma / Analytics',
        a: `<b>AUTO_INCREMENT</b> (MySQL) automatically generates a unique sequential number for a column every time a new row is inserted. It's most commonly used for primary key columns so you don't have to manually specify an ID for each row.<br><br>
<b>Syntax varies by database:</b>
<ul>
<li><b>MySQL:</b> INT AUTO_INCREMENT</li>
<li><b>SQL Server:</b> INT IDENTITY(1,1)</li>
<li><b>PostgreSQL:</b> SERIAL or GENERATED ALWAYS AS IDENTITY</li>
<li><b>SQLite:</b> INTEGER PRIMARY KEY (auto-increments automatically)</li>
</ul>
<b>Important:</b> If you delete a row with AUTO_INCREMENT, that number is NOT reused. So gaps in IDs are normal and expected.`,
        code: `-- MySQL
employee_id INT AUTO_INCREMENT PRIMARY KEY

-- SQL Server
employee_id INT IDENTITY(1,1) PRIMARY KEY

-- PostgreSQL
employee_id SERIAL PRIMARY KEY`
      },
      {
        q: 'What is a PRIMARY KEY? Can a table have more than one PRIMARY KEY?',
        company: 'TCS / Cognizant',
        a: `A <b>PRIMARY KEY</b> is a column (or combination of columns) that <b>uniquely identifies each row</b> in a table. It enforces two rules automatically: <b>NOT NULL</b> (cannot be empty) and <b>UNIQUE</b> (no duplicates).<br><br>
<b>A table can have only ONE primary key</b> — but that primary key can consist of multiple columns (called a <b>composite primary key</b>).<br><br>
Example of composite primary key: An enrollment table where (student_id + course_id) together identify a unique enrollment.`,
        code: `-- Single column primary key
CREATE TABLE employees (
  employee_id INT PRIMARY KEY,
  name VARCHAR(50)
);

-- Composite primary key
CREATE TABLE enrollments (
  student_id INT,
  course_id  INT,

<li><b>NOT NULL</b> — column cannot be empty</li>

<li><b>PRIMARY KEY</b> — NOT NULL + UNIQUE, uniquely identifies each row</li>

    content: `<div class="section-label">📖 PRIMARY KEY</div>
<div class="theory-text">
A <b>PRIMARY KEY</b> is a column (or combination of columns) that <b>uniquely identifies each row</b> in a table. Rules:<br>
<ul>
<li>Must be UNIQUE — no two rows can have the same PRIMARY KEY value</li>
<li>Cannot be NULL</li>
<li>Each table can have only ONE primary key</li>
<li>Can be a single column or composite (multiple columns)</li>
</ul>
<div class="highlight">Think of PRIMARY KEY as the "ID card" of each row — it's how you can always find exactly one specific record.</div>
</div>
<div class="section-label" style="margin-top:22px">📖 FOREIGN KEY</div>
<div class="theory-text">
A <b>FOREIGN KEY</b> is a column in one table that references the PRIMARY KEY of another table. It creates a <b>parent-child relationship</b> between tables and enforces <b>referential integrity</b> — you cannot have a child record pointing to a parent that doesn't exist.
<ul>
<li><b>Parent table</b>: the table being referenced (has the PRIMARY KEY)</li>
<li><b>Child table</b>: the table with the FOREIGN KEY</li>
</ul>
<div class="warn-box">⚠️ You cannot insert a child record with a foreign key value that doesn't exist in the parent table. You cannot delete a parent record that has children unless CASCADE is set.</div>
</div>`,

<b>Types of JOINs:</b>
<ul>
<li><b>INNER JOIN</b>: Returns only rows where there is a match in BOTH tables (intersection)</li>
<li><b>LEFT JOIN</b>: Returns ALL rows from left table + matched rows from right (unmatched = NULL)</li>
<li><b>RIGHT JOIN</b>: Returns ALL rows from right table + matched rows from left</li>
<li><b>FULL OUTER JOIN</b>: Returns ALL rows from BOTH tables (unmatched = NULL on either side)</li>

<div class="theory-text">
<b>CASE WHEN</b> is SQL's if-then-else. It works in SELECT, WHERE, ORDER BY, GROUP BY, and HAVING. Two forms:<br><br>
<b>Searched CASE</b>: Tests any condition. Most flexible.<br>
<b>Simple CASE</b>: Compares one expression to multiple values. Like a switch statement.
<div class="highlight">CASE WHEN is extremely common in interviews and real work — it's used for data transformation, custom sorting, conditional aggregation, and categorization.</div>
</div>
<div class="section-label" style="margin-top:22px">📖 NULL Handling</div>
<div class="theory-text">
NULL means "unknown" — not zero, not empty string, not false. This causes unexpected behavior:
<ul>
<li>NULL = NULL → NULL (not TRUE!)</li>
<li>NULL + 5 → NULL</li>
<li>NULL in aggregate functions is ignored (except COUNT(*))</li>
</ul>
<b>Functions to handle NULL:</b>
<ul>
<li><b>COALESCE(a, b, c)</b> — returns first non-NULL value</li>
<li><b>ISNULL(val, default)</b> — SQL Server specific</li>
<li><b>NVL(val, default)</b> — Oracle specific</li>
<li><b>IFNULL(val, default)</b> — MySQL specific</li>
<li><b>NULLIF(a, b)</b> — returns NULL if a = b, else a</li>
</ul>
</div>`,

    content: `<div class="section-label">📖 Window Functions</div>
<div class="theory-text">
<b>Window functions</b> perform calculations across a set of rows related to the current row — without collapsing them into a single result like GROUP BY does. They are the most powerful SQL feature for analytics.<br><br>
Syntax: <code>function() OVER (PARTITION BY ... ORDER BY ...)</code><br><br>
<b>PARTITION BY</b>: Defines the "window" — like GROUP BY but rows aren't collapsed<br>
<b>ORDER BY</b>: Defines order within the partition for ranking/lag functions<br><br>
<b>Key ranking functions:</b>
<ul>
<li><b>ROW_NUMBER()</b> — sequential number, no ties: 1,2,3,4</li>
<li><b>RANK()</b> — ranks with gaps for ties: 1,2,2,4</li>
<li><b>DENSE_RANK()</b> — ranks without gaps: 1,2,2,3</li>
<li><b>NTILE(n)</b> — divides rows into n equal buckets</li>
</ul>
</div>`,
    syntax: `<span class="cm">-- ROW_NUMBER: sequential numbering</span>

  <span class="fn">RANK</span>() <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> department <span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>) <span class="kw">AS</span> rnk,
  <span class="fn">DENSE_RANK</span>() <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> department <span class="kw">ORDER BY</span> salary <span class="kw">DESC</span>) <span class="kw">AS</span> dense_rnk
<span class="kw">FROM</span> <span class="tbl">employees</span>;

<span class="kw">SELECT</span> * <span class="kw">FROM</span> (

  <span class="kw">FROM</span> <span class="tbl">employees</span>

    day: 23, title: 'Indexes & Query Performance',

    content: `<div class="section-label">📖 What is an Index?</div>
<div class="theory-text">
An <b>index</b> is a separate data structure that stores a sorted copy of one or more columns along with a pointer to the corresponding table row. It works like the index at the back of a book — instead of reading every page (full table scan), you jump directly to the right entry.<br><br>
<b>Types of indexes:</b>
<ul>
<li><b>Clustered Index</b>: Data rows are physically stored in index order. One per table. PRIMARY KEY creates this automatically.</li>
<li><b>Non-Clustered Index</b>: Separate structure with pointers to data rows. Multiple allowed per table.</li>
<li><b>Composite Index</b>: Index on multiple columns. Column order matters!</li>
<li><b>Unique Index</b>: Created automatically by UNIQUE constraint.</li>
<li><b>Covering Index</b>: Includes all columns needed by a query — no table lookup required.</li>
</ul>
<div class="warn-box">⚠️ Too many indexes slow down INSERT/UPDATE/DELETE — each index must be maintained when data changes. Index the right columns, not every column.</div>
</div>`,
    syntax: `<span class="cm">-- Create an index</span>
<span class="kw">CREATE INDEX</span> idx_emp_dept <span class="kw">ON</span> <span class="tbl">employees</span>(department);

<span class="cm">-- Composite index (column order matters!)</span>
<span class="kw">CREATE INDEX</span> idx_dept_salary <span class="kw">ON</span> <span class="tbl">employees</span>(department, salary);

<span class="cm">-- Unique index</span>
<span class="kw">CREATE UNIQUE INDEX</span> idx_email <span class="kw">ON</span> <span class="tbl">employees</span>(email);

<span class="cm">-- View indexes on a table (MySQL)</span>
<span class="kw">SHOW INDEX FROM</span> <span class="tbl">employees</span>;

<span class="cm">-- Check query execution plan</span>
<span class="kw">EXPLAIN</span> <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">employees</span> <span class="kw">WHERE</span> department = <span class="str">'Engineering'</span>;`,
    theory2: `<div class="section-label" style="margin-top:22px">⚡ When Indexes Are NOT Used</div>
<div class="theory-text">
Even if an index exists, the optimizer may skip it when:
<ul>
<li>Using functions on the indexed column: <code>WHERE UPPER(email) = 'X'</code> — index on email can't be used</li>
<li>Leading wildcard: <code>WHERE name LIKE '%Rahul'</code> — can't use index</li>
<li>Type mismatch: comparing VARCHAR column to a number</li>
<li>Table is very small — full scan is faster than index lookup</li>
<li>Low cardinality column (e.g., is_active: only 2 values) — index not worth it</li>
</ul>
</div>`,
    practiceSQL: `-- See existing indexes in SQLite
SELECT type, name, tbl_name, sql
FROM sqlite_master
WHERE type = 'index';

-- Create an index
CREATE INDEX idx_dept ON employees(department);

-- Now try an EXPLAIN QUERY PLAN:
EXPLAIN QUERY PLAN
SELECT * FROM employees WHERE department = 'Engineering';

-- Composite index
CREATE INDEX idx_dept_active ON employees(department, is_active);

-- This query will use the composite index:
SELECT * FROM employees

      { q: 'What is an index and how does it improve query performance?', company: 'Every company',
        a: `An index is a separate data structure (typically a B-tree) that stores sorted column values with pointers to the actual rows. Without an index, the database reads every row (full table scan = O(n)). With an index, it uses binary search (O(log n)) to jump directly to matching rows.<br><br>
<b>Example</b>: Table with 1 million employees. Finding all Engineering employees:<br>
• Without index: scan all 1M rows<br>
• With index on department: jump to 'Engineering' entries directly — maybe 100,000 rows found instantly`,
        code: `-- Slow (full table scan — 1M rows examined):
SELECT * FROM employees WHERE department = 'Engineering';

-- Add index:
CREATE INDEX idx_dept ON employees(department);

-- Now fast (index lookup — jumps to Engineering entries):
SELECT * FROM employees WHERE department = 'Engineering';
-- MySQL EXPLAIN shows: key: idx_dept (index used)` },
      { q: 'What columns should you index?', company: 'DBA / performance interviews',
        a: `Good candidates for indexing:<br>
• Columns frequently used in WHERE clauses<br>
• JOIN columns (foreign keys always, primary keys auto-indexed)<br>
• Columns used in ORDER BY on large result sets<br>
• Columns used in GROUP BY on large datasets<br><br>
Bad candidates:<br>
• Low-cardinality columns (is_active, gender — only 2 values)<br>
• Columns that are rarely queried<br>
• Very wide columns (large text blobs)<br>
• Tables with very frequent writes and few reads`,
        code: `-- Good: high cardinality, frequently searched

CREATE INDEX idx_order_date ON orders(order_date);  -- date range queries

-- Questionable: low cardinality
CREATE INDEX idx_status ON orders(status);
-- status has 3 values — optimizer might prefer full scan anyway

-- Foreign keys MUST be indexed:
CREATE INDEX idx_orders_customer ON orders(customer_id);` },
      { q: 'What is a covering index?', company: 'Oracle / SQL Server / advanced',
        a: `A <b>covering index</b> includes all the columns a query needs — so the database can answer the query entirely from the index without touching the actual table (no "table lookup" / "key lookup").<br><br>
This is the fastest possible index — zero table I/O after the index scan.`,
        code: `-- Query needs: department, name, salary
SELECT name, salary FROM employees WHERE department = 'Engineering';

-- Regular index (not covering):
CREATE INDEX idx_dept ON employees(department);
-- Index finds rows, then fetches name and salary from table

-- Covering index (includes all needed columns):
CREATE INDEX idx_dept_covering ON employees(department, name, salary);
-- Query fully answered from index — no table access!

-- MySQL: EXPLAIN shows "Using index" = covering index used` },
      { q: 'What is a composite index? Does column order matter?', company: 'Oracle / MySQL',
        a: `A <b>composite index</b> is an index on multiple columns. <b>Column order critically matters</b>.<br><br>
A composite index on (dept, salary) can be used for:<br>
• WHERE dept = 'Engineering' ✓ (leftmost prefix)<br>
• WHERE dept = 'Engineering' AND salary > 70000 ✓ (both columns)<br>
• WHERE salary > 70000 ✗ (not leftmost — index not used!)<br><br>
Rule: Always put the most selective (highest cardinality) or most commonly filtered column first.`,
        code: `CREATE INDEX idx_dept_salary ON employees(department, salary);

-- Uses index:
SELECT * FROM employees WHERE department = 'Engineering';
SELECT * FROM employees WHERE department = 'Engineering' AND salary > 70000;

-- Does NOT use this index (skips leading column):
SELECT * FROM employees WHERE salary > 70000;
-- Need: CREATE INDEX idx_salary ON employees(salary);` },
      { q: 'What is EXPLAIN/EXPLAIN PLAN? What do you look for?', company: 'DBA / MySQL',
        a: `EXPLAIN shows the query execution plan — how the optimizer will run your query. Key things to look for:<br><br>
<b>In MySQL EXPLAIN:</b><br>
• <b>type</b>: ALL (bad = full scan), ref/eq_ref (good = index lookup), const (best = single row)<br>
• <b>key</b>: which index is used (NULL = no index)<br>
• <b>rows</b>: estimated rows examined (lower = better)<br>
• <b>Extra</b>: "Using index" (covering index), "Using filesort" (sort without index — slow), "Using temporary" (temp table — slow)`,
        code: `EXPLAIN SELECT * FROM employees WHERE department = 'Engineering';

-- Without index output:
-- type: ALL, key: NULL, rows: 1000  ← bad

-- After CREATE INDEX idx_dept ON employees(department):
-- type: ref, key: idx_dept, rows: 120  ← good

-- Look for warnings in Extra:
-- "Using filesort" → add index on ORDER BY column
-- "Using temporary" → complex GROUP BY, consider refactoring` },
      { q: 'What is an index on a function? How do you handle WHERE UPPER(col)?', company: 'Oracle / PostgreSQL',
        a: `A regular index on a column cannot be used when you apply a function to it in WHERE. The solution is a <b>function-based index</b> (or computed index).<br><br>
PostgreSQL: <code>CREATE INDEX ON employees(LOWER(email))</code><br>
Oracle: <code>CREATE INDEX ON employees(UPPER(email))</code><br>
MySQL: Use generated columns + index on the generated column`,
        code: `-- Problem: index on email not used!
CREATE INDEX idx_email ON employees(email);
SELECT * FROM employees WHERE UPPER(email) = 'RAHUL@CO.COM';
-- Function prevents index use

-- Fix in PostgreSQL:
CREATE INDEX idx_email_lower ON employees(LOWER(email));
SELECT * FROM employees WHERE LOWER(email) = 'rahul@co.com';
-- Index is now used!

-- Fix in MySQL (generated column):
ALTER TABLE employees ADD email_lower VARCHAR(100) GENERATED ALWAYS AS (LOWER(email));
CREATE INDEX idx_email_lower ON employees(email_lower);` },
      { q: 'What causes index fragmentation and how do you fix it?', company: 'DBA / SQL Server',
        a: `<b>Index fragmentation</b> occurs over time as data is inserted, updated, and deleted — the index pages become partially filled and out of order, slowing down reads.<br><br>
<b>Logical fragmentation</b>: Pages out of order (index order ≠ physical order)<br>
<b>Internal fragmentation</b>: Pages are partially empty (wasted space)<br><br>
<b>Fix:</b><br>
• <b>REBUILD</b>: Drops and recreates the index — eliminates all fragmentation. Locks table (online rebuild available in Enterprise).<br>
• <b>REORGANIZE</b>: Defragments in place. Lighter operation, always online. Best for low fragmentation.`,
        code: `-- SQL Server: check fragmentation
SELECT * FROM sys.dm_db_index_physical_stats(DB_ID(), NULL, NULL, NULL, 'LIMITED');

-- Reorganize (light, <30% fragmentation):
ALTER INDEX idx_dept ON employees REORGANIZE;

-- Rebuild (heavy, >30% fragmentation):
ALTER INDEX idx_dept ON employees REBUILD;
-- Or rebuild all indexes:
ALTER INDEX ALL ON employees REBUILD;` },
      { q: 'What is a partial/filtered index?', company: 'PostgreSQL / SQL Server',
        a: `A <b>partial index</b> (also called filtered index in SQL Server) only indexes rows that meet a specific condition. This makes the index smaller and faster — especially useful when you always query with a specific WHERE condition.`,
        code: `-- Only index active employees (WHERE is_active = 1):
-- PostgreSQL:
CREATE INDEX idx_active_employees ON employees(email)
WHERE is_active = TRUE;

-- SQL Server:
CREATE INDEX idx_active ON employees(email)
WHERE is_active = 1;

-- This query uses the partial index:
SELECT * FROM employees WHERE email = 'x@co.com' AND is_active = TRUE;

-- This query CANNOT use it (no is_active filter):
SELECT * FROM employees WHERE email = 'x@co.com';` }
    ]
  },

    day: 24, title: 'Views, Stored Procedures & Transactions',
    subtitle: 'Database objects and ACID properties',
    duration: '~60 min', questions: 8,
    content: `<div class="section-label">📖 Views</div>
<div class="theory-text">
A <b>VIEW</b> is a named, saved SELECT query stored in the database. It behaves like a virtual table — you query it like a table but it always runs the underlying SELECT when accessed.<br><br>
<b>Benefits:</b>
<ul>
<li>Security: expose only needed columns/rows to users</li>
<li>Abstraction: hide complex joins behind a simple name</li>
<li>Reusability: define once, use many times</li>
<li>Backward compatibility: change underlying tables without breaking reports</li>
</ul>
<div class="warn-box">⚠️ Views are not cached by default — every query on a view re-executes the underlying SELECT. For performance, use materialized views (PostgreSQL) or indexed views (SQL Server).</div>
</div>`,
    syntax: `<span class="cm">-- Create a view</span>
<span class="kw">CREATE VIEW</span> active_employees_vw <span class="kw">AS</span>
<span class="kw">SELECT</span> employee_id, first_name, last_name, department, salary

    theory2: `<div class="section-label" style="margin-top:22px">🔐 ACID Properties</div>
<div class="theory-text">
ACID is a set of properties that guarantee database transactions are processed reliably:
<ul>
<li><b>Atomicity</b>: All operations in a transaction succeed or all fail together. No partial commits.</li>
<li><b>Consistency</b>: Database moves from one valid state to another. Constraints are never violated mid-transaction.</li>
<li><b>Isolation</b>: Concurrent transactions don't interfere with each other.</li>
<li><b>Durability</b>: Once committed, data survives system crashes (written to disk).</li>
</ul>
<div class="highlight">ACID is the most asked theory question in SQL interviews. Remember the acronym: Atomicity, Consistency, Isolation, Durability.</div>
</div>`,

-- Simulate a transaction

  UPDATE employees SET salary = salary + 5000 WHERE employee_id = 2;
COMMIT;

-- Verify

WHERE employee_id IN (1, 2);`,

    interview: [
      { q: 'What are ACID properties? Explain each with an example.', company: 'Every SQL interview',
        a: `<b>A — Atomicity</b>: A transaction is all or nothing. Bank transfer: debit ₹1000 from A AND credit ₹1000 to B. If credit fails, debit must also be rolled back. You never lose money from a partial transaction.<br><br>
<b>C — Consistency</b>: Database must remain in a valid state before and after transaction. If a constraint says account balance can't go negative, any transaction that would violate this is rejected.<br><br>
<b>I — Isolation</b>: Concurrent transactions are isolated from each other. If two people book the last seat simultaneously, isolation ensures only one succeeds.<br><br>
<b>D — Durability</b>: Once committed, the data is permanent — survives server crashes, power failures. Written to disk, not just memory.`,
        code: `-- Atomicity example:
BEGIN TRANSACTION;
  UPDATE accounts SET balance = balance - 1000 WHERE acc='A';  -- debit
  UPDATE accounts SET balance = balance + 1000 WHERE acc='B';  -- credit
  -- If any error occurs:
  ROLLBACK;  -- both operations undone
  -- If all ok:
  COMMIT;   -- both operations permanent` },
      { q: 'What is the difference between a VIEW and a TABLE?', company: 'TCS / Infosys',
        a: `<b>TABLE</b>: Physically stores data on disk. Data persists. DML (INSERT/UPDATE/DELETE) directly modifies stored data.<br><br>
<b>VIEW</b>: Virtual table — no physical data storage. Just a saved SELECT query. When you query a view, the database executes the underlying SELECT in real-time. Data always reflects current table state.<br><br>
Memory trick: Table = actual storage. View = a window into table(s).`,
        code: `-- Table: actual data stored
CREATE TABLE employees (emp_id INT, name VARCHAR(100), ...);

-- View: no storage, just a saved query

<b>Drawback</b>: Data can be stale until refreshed. Extra storage needed.<br><br>

        code: `-- PostgreSQL materialized view:

      { q: 'What is a stored procedure? How is it different from a function?', company: 'Oracle / SQL Server',
        a: `<b>Stored Procedure</b>: A saved block of SQL + procedural code stored in the database. Can have IN/OUT parameters. Can perform INSERT/UPDATE/DELETE. Cannot be used directly in a SELECT.<br><br>

        code: `-- Stored Procedure:

      { q: 'What are transaction isolation levels?', company: 'Oracle / SQL Server / advanced',
        a: `Isolation levels control how much one transaction can see from other concurrent transactions. Higher isolation = more safety, less concurrency.<br><br>
<b>READ UNCOMMITTED</b>: Sees uncommitted changes from other transactions ("dirty reads"). Fastest, least safe.<br>
<b>READ COMMITTED</b>: Only sees committed data. Default in most databases.<br>
<b>REPEATABLE READ</b>: All reads in the transaction see the same snapshot. Prevents non-repeatable reads.<br>
<b>SERIALIZABLE</b>: Fully isolated — transactions run as if sequential. Slowest, most safe.`,
        code: `-- Set isolation level:
SET TRANSACTION ISOLATION LEVEL READ COMMITTED;

-- Common issues by level:
-- READ UNCOMMITTED: dirty reads possible (see uncommitted data)
-- READ COMMITTED: non-repeatable reads possible (row changes mid-transaction)
-- REPEATABLE READ: phantom reads possible (new rows appear mid-transaction)
-- SERIALIZABLE: all anomalies prevented

-- Default: READ COMMITTED in MySQL/PostgreSQL/Oracle` },

        a: `A <b>trigger</b> is a stored procedure that automatically executes in response to specific events (INSERT, UPDATE, DELETE) on a table.<br><br>

    content: `<div class="section-label">📖 Normalization Forms</div>
<div class="theory-text">
Normalization is the process of organizing tables to minimize redundancy and dependency.<br><br>
<b>1NF (First Normal Form):</b> Each cell has exactly one value (atomic). No repeating groups. Each row is unique.<br><br>
<b>2NF (Second Normal Form):</b> Must be 1NF + every non-key column depends on the FULL primary key (no partial dependency — only an issue with composite keys).<br><br>
<b>3NF (Third Normal Form):</b> Must be 2NF + no transitive dependencies (non-key column should NOT depend on another non-key column).<br><br>
<b>BCNF (Boyce-Codd NF):</b> Stricter version of 3NF — every determinant must be a candidate key.
<div class="highlight">Interview tip: "The key, the whole key, and nothing but the key" describes 3NF in a memorable phrase.</div>
</div>`,
    syntax: `<span class="cm">-- Example: violating 3NF → normalize it</span>

<span class="cm">-- Before (3NF violation — dept_manager depends on dept, not emp_id):</span>
<span class="cm">-- employees: emp_id, emp_name, dept_id, dept_name, dept_manager</span>

<span class="cm">-- After 3NF (split into two tables):</span>
<span class="kw">CREATE TABLE</span> <span class="tbl">departments</span> (
  dept_id      <span class="dt">INT</span>          <span class="kw">PRIMARY KEY</span>,
  dept_name    <span class="dt">VARCHAR(50)</span>,
  dept_manager <span class="dt">VARCHAR(100)</span>  <span class="cm">-- depends only on dept_id ✓</span>
);

<span class="kw">CREATE TABLE</span> <span class="tbl">employees</span> (

  emp_name <span class="dt">VARCHAR(100)</span>,

);`,

      { q: 'What is the CAP theorem? How does it relate to databases?', company: 'System design / senior',
        a: `The <b>CAP theorem</b> states that a distributed system can guarantee at most 2 of 3 properties simultaneously:<br><br>
<b>C — Consistency</b>: Every read receives the most recent write<br>
<b>A — Availability</b>: Every request receives a response<br>
<b>P — Partition Tolerance</b>: System continues operating despite network partitions<br><br>
Traditional RDBMS (MySQL, PostgreSQL) prioritize CP (Consistency + Partition tolerance).<br>
NoSQL like Cassandra/DynamoDB prioritize AP (Availability + Partition tolerance).<br><br>
This is why NoSQL may show "eventually consistent" data — they sacrifice strict consistency for availability.`,

function buildSidebar() {

        <p style="color:#94a3b8;font-size:14px;line-height:1.7;max-width:420px;margin:0 auto 20px;">Complete all 30 days and earn a personalised Certificate of Completion with your name — downloadable as PDF.</p>
        <a href="/sql-prep/" style="display:inline-block;background:#3b82f6;color:#fff;border-radius:10px;padding:13px 28px;font-size:15px;font-weight:800;text-decoration:none;">Buy Full Access to Earn Certificate →</a>
      `}
    </div>
    ` : ''}
  `;
  // Auto-scroll to certificate section on Day 30
  if (dayNum === 30) {
    setTimeout(() => {
      const certEl = document.getElementById('cert-section');
      if (certEl) certEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

function goDay(n) {
  const d = curriculum.find(c => c.day === n);
  if (!d || d.locked) { alert('This day is coming soon! Full content will be released shortly.'); return; }
  currentDay = n; buildSidebar(); renderDay(n);
}

function togglePracticeAnswer(dayNum) {
  const el = document.getElementById(`practice-answer-${dayNum}`);
  const btn = document.getElementById(`pa-btn-${dayNum}`);
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '🙈 Hide Answer' : '💡 Show Answer';
}

function toggleAnswer(day, idx) {
  const ans = document.getElementById(`ans-${day}-${idx}`);
  const btn = document.getElementById(`tbtn-${day}-${idx}`);
  const isOpen = ans.classList.contains('open');
  ans.classList.toggle('open', !isOpen);
  btn.textContent = isOpen ? 'Show Answer' : 'Hide Answer';
}

function toggleComplete(dayNum) {
  let done = getCompleted();
  const pos = done.indexOf(dayNum);
  if (pos === -1) done.push(dayNum); else done.splice(pos, 1);
  saveCompleted(done);
  buildSidebar();
  renderDay(dayNum);
}

function runSQL(dayNum) {
  const input = document.getElementById(`sql-input-${dayNum}`);
  const result = document.getElementById(`result-${dayNum}`);
  const btn = document.getElementById(`run-btn-${dayNum}`);
  const sql = input.value.trim();
  if (!sql) return;
  if (!db) { result.className='result-area error'; result.textContent='⏳ Database loading... please wait a moment and try again.'; return; }

  btn.disabled = true; btn.textContent = '⏳ Running...';
  result.className = 'result-area';

  try {
    const stmts = sql.split(';').map(s => s.trim()).filter(s => s.length > 0);
    let lastResult = null;
    let messages = [];
    for (const stmt of stmts) {
      try {
        const res = db.exec(stmt);
        if (res.length > 0) lastResult = res[0];
        else {
          const lower = stmt.toLowerCase();
          if (lower.startsWith('insert')) messages.push('✅ Row inserted successfully.');
          else if (lower.startsWith('update')) messages.push('✅ Rows updated successfully.');
          else if (lower.startsWith('delete')) messages.push('✅ Rows deleted successfully.');
          else if (lower.startsWith('create')) messages.push('✅ Table created successfully.');
          else if (lower.startsWith('alter')) messages.push('✅ Table altered successfully.');
          else if (lower.startsWith('drop')) messages.push('✅ Table dropped successfully.');
          else messages.push('✅ Statement executed successfully.');
        }
      } catch(e) { messages.push('❌ ' + e.message); }
    }
    if (lastResult) {
      const tbl = document.createElement('table');
      tbl.className = 'result-table';
      const thead = document.createElement('thead');
      const hrow = document.createElement('tr');
      lastResult.columns.forEach(c => { const th = document.createElement('th'); th.textContent = c; hrow.appendChild(th); });
      thead.appendChild(hrow); tbl.appendChild(thead);
      const tbody = document.createElement('tbody');
      lastResult.values.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(v => { const td = document.createElement('td'); td.textContent = v ?? 'NULL'; tr.appendChild(td); });
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      result.innerHTML = '';
      if (messages.length) { const m = document.createElement('div'); m.style.cssText='color:#166534;font-size:12px;margin-bottom:8px'; m.textContent = messages.join(' '); result.appendChild(m); }
      result.appendChild(tbl);
      result.className = 'result-area';
    } else {
      result.textContent = messages.join('\n');
      result.className = 'result-area success';
    }
  } catch(e) {
    result.textContent = '❌ Error: ' + e.message;
    result.className = 'result-area error';
  }
  btn.disabled = false; btn.textContent = '▶ Run Query';
}
