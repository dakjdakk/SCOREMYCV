  <text x="540" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" fill="#7C3AED">📤</text>
  <text x="540" y="470" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" fill="#4C1D95">You Apply on</text>
  <text x="540" y="555" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" fill="#4C1D95">Naukri / LinkedIn</text>
